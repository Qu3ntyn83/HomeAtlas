services:
  labvis:
    build: .
    image: labvis:latest
    container_name: labvis
    restart: unless-stopped
    # Host-Netz: nur so sieht der Scanner MAC-Adressen und Hersteller (ARP) der Geräte im eigenen Netz.
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      LABVIS_PORT: "8099"            # Weboberfläche: http://<host>:8099
      LABVIS_USER: "admin"          # Name des ersten Kontos
      LABVIS_PASSWORD: "${LABVIS_PASSWORD:-}"   # legt beim ersten Start das Konto an; leer = Einrichtung im Browser
      TZ: "Europe/Berlin"
    volumes:
      - ./data:/data
