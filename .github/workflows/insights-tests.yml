name: Infrastructure insights tests
on:
  push:
    branches: [feature/pre-hardening, main]
  pull_request:
permissions:
  contents: read
jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt httpx pytest
      - run: python -m pytest -q tests/
      - run: node --check app/static/app.js
